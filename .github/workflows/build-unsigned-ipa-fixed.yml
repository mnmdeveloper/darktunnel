name: DarkTunnel — Build unsigned IPA for ESign

run-name: "DarkTunnel • Unsigned IPA • ${{ github.ref_name }}"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_build:
        description: Clean DerivedData before compiling
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build DarkTunnel unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout DarkTunnel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Checkout VK TURN engine
        uses: actions/checkout@v4
        with:
          repository: anton48/vk-turn-proxy-ios
          ref: main
          path: Vendor/vk-turn-proxy-ios
          fetch-depth: 1

      - name: Checkout AmneziaWG Apple engine
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amneziawg-apple
          ref: master
          path: Vendor/amneziawg-apple
          fetch-depth: 1

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version
          xcodebuild -version

      - name: Patch utun helper
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('PacketTunnel/PacketTunnelProvider.swift')
          s = p.read_text()
          pattern = r'    private func findTunFileDescriptor\(\) -> Int32\? \{.*?\n    \}'
          replacement = '''    private func findTunFileDescriptor() -> Int32? {
              let fd = dt_find_utun_fd()
              return fd >= 0 ? fd : nil
          }'''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('findTunFileDescriptor() not found')
          p.write_text(s)
          Path('PacketTunnel/BridgeHeader.h').write_text('''#ifndef DarkTunnel_BridgeHeader_h
#define DarkTunnel_BridgeHeader_h
#include <stdint.h>
#include "wireguard_turn.h"
#include "AmneziaWGBridge.h"
#ifdef __cplusplus
extern "C" {
#endif
int32_t dt_find_utun_fd(void);
#ifdef __cplusplus
}
#endif
#endif
''')
          Path('PacketTunnel/UTunHelper.m').write_text('''#include <stdint.h>
#include <string.h>
#include <sys/socket.h>
#include <sys/types.h>
#ifndef DT_SYSPROTO_CONTROL
#define DT_SYSPROTO_CONTROL 2
#endif
#ifndef DT_UTUN_OPT_IFNAME
#define DT_UTUN_OPT_IFNAME 2
#endif
#ifndef IFNAMSIZ
#define IFNAMSIZ 16
#endif
int32_t dt_find_utun_fd(void) {
    for (int32_t fd = 0; fd <= 1024; fd++) {
        char ifname[IFNAMSIZ] = {0};
        socklen_t length = (socklen_t)sizeof(ifname);
        if (getsockopt(fd, DT_SYSPROTO_CONTROL, DT_UTUN_OPT_IFNAME, ifname, &length) != 0) continue;
        if (strncmp(ifname, "utun", 4) == 0) return fd;
    }
    return -1;
}
''')
          PY

      - name: Namespace AmneziaWG symbols
        working-directory: Vendor/amneziawg-apple/Sources/WireGuardKitGo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          names = ('wgSetLogger','wgTurnOn','wgTurnOff','wgSetConfig','wgGetConfig','wgBumpSockets','wgDisableSomeRoamingForBrokenMobileSemantics','wgVersion')
          changed = 0
          for p in Path('.').rglob('*.go'):
              old = p.read_text(); new = old
              for name in names: new = new.replace(name, 'awg' + name[2:])
              if new != old: p.write_text(new); changed += 1
          if not changed: raise SystemExit('No AmneziaWG bridge symbols found')
          print(f'changed {changed} Go files')
          PY

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: Vendor/amneziawg-apple/Sources/WireGuardKitGo/go.mod

      - name: Build VK TURN bridge
        working-directory: Vendor/vk-turn-proxy-ios/WireGuardBridge
        run: |
          set -euo pipefail
          chmod -R u+rwX .
          make clean
          make xcframework
          test -d build/WireGuardTURN.xcframework
          test -f build/WireGuardTURN.xcframework/ios-arm64/libwg-turn-ios-arm64.a

      - name: Build AmneziaWG bridge
        working-directory: Vendor/amneziawg-apple/Sources/WireGuardKitGo
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/awg-build"
          rm -rf "$TMP" out
          mkdir -p "$TMP/bin" out
          chmod -R u+rwX "$TMP" out .
          REAL_RSYNC="$(command -v rsync)"
          printf '#!/bin/sh\nexec "%s" --chmod=u+rwX "$@"\n' "$REAL_RSYNC" > "$TMP/bin/rsync"
          chmod 755 "$TMP/bin/rsync"
          export PATH="$TMP/bin:$PATH"
          make clean
          PLATFORM_NAME=iphoneos SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" ARCHS=arm64 CONFIGURATION_TEMP_DIR="$TMP" CONFIGURATION_BUILD_DIR="$PWD/out" make build
          test -s out/libwg-go.a
          nm -gU out/libwg-go.a | grep -E ' _?awg(SetLogger|TurnOn|TurnOff|SetConfig|GetConfig|BumpSockets|DisableSomeRoamingForBrokenMobileSemantics|Version)$'

      - name: Generate fresh Xcode project
        run: |
          set -euo pipefail
          test -f project-unsigned.yml
          rm -rf DarkTunnel.xcodeproj
          xcodegen generate --spec project-unsigned.yml
          test -f DarkTunnel.xcodeproj/project.pbxproj
          xcodebuild -project DarkTunnel.xcodeproj -list

      - name: Build unsigned app
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/DerivedData"
          if [ "${{ inputs.clean_build || true }}" = "true" ]; then rm -rf "$DERIVED"; fi
          xcodebuild build -project DarkTunnel.xcodeproj -scheme DarkTunnel -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM=''

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/DarkTunnel.app"
          IPA="$RUNNER_TEMP/DarkTunnel-unsigned-for-ESign.ipa"
          test -d "$APP"
          test -d "$APP/PlugIns/PacketTunnel.appex"
          test -d "$APP/PlugIns/DarkTunnelLiveActivity.appex"
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          find "$RUNNER_TEMP/ipa/Payload" -name _CodeSignature -type d -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/ipa/Payload" -name embedded.mobileprovision -type f -delete
          cd "$RUNNER_TEMP/ipa"
          zip -qry -X "$IPA" Payload
          unzip -tq "$IPA"
          ls -lh "$IPA"

      - name: Upload DarkTunnel unsigned IPA for ESign
        uses: actions/upload-artifact@v4
        with:
          name: DarkTunnel-unsigned-for-ESign
          path: ${{ runner.temp }}/DarkTunnel-unsigned-for-ESign.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DarkTunnel-build-logs
          path: |
            ${{ runner.temp }}/DerivedData/Logs/**/*.xcactivitylog
            ${{ runner.temp }}/DerivedData/Build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
