name: Build unsigned IPA for ESign

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unsigned-ipa-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout DarkTunnel
        uses: actions/checkout@v4

      - name: Checkout VK TURN engine
        uses: actions/checkout@v4
        with:
          repository: anton48/vk-turn-proxy-ios
          ref: main
          path: Vendor/vk-turn-proxy-ios

      - name: Checkout AmneziaWG Apple engine
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amneziawg-apple
          ref: master
          path: Vendor/amneziawg-apple

      - name: Fix iOS utun descriptor lookup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          provider = Path('PacketTunnel/PacketTunnelProvider.swift')
          text = provider.read_text()
          pattern = r'    private func findTunFileDescriptor\(\) -> Int32\? \{.*?\n    \}'
          replacement = '''    private func findTunFileDescriptor() -> Int32? {
          let fd = dt_find_utun_fd()
          return fd >= 0 ? fd : nil
      }'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected PacketTunnel utun lookup was not found')
          provider.write_text(text)

          bridge = Path('PacketTunnel/BridgeHeader.h')
          bridge.write_text('''#ifndef DarkTunnel_BridgeHeader_h
#define DarkTunnel_BridgeHeader_h

#include <stdint.h>
#include "wireguard_turn.h"
#include "AmneziaWGBridge.h"

#ifdef __cplusplus
extern "C" {
#endif

int32_t dt_find_utun_fd(void);

#ifdef __cplusplus
}
#endif

#endif
''')

          helper = Path('PacketTunnel/UTunHelper.m')
          helper.write_text('''#include <stdint.h>
#include <string.h>
#include <sys/ioctl.h>
#include <sys/socket.h>
#include <sys/types.h>

#ifndef CTLIOCGINFO
#define CTLIOCGINFO 0xc0644e03UL
#endif

#ifndef AF_SYSTEM
#define AF_SYSTEM 32
#endif

#ifndef AF_SYS_CONTROL
#define AF_SYS_CONTROL 2
#endif

#ifndef MAX_KCTL_NAME
#define MAX_KCTL_NAME 96
#endif

struct dt_ctl_info {
    uint32_t ctl_id;
    char ctl_name[MAX_KCTL_NAME];
};

struct dt_sockaddr_ctl {
    uint8_t sc_len;
    uint8_t sc_family;
    uint16_t ss_sysaddr;
    uint32_t sc_id;
    uint32_t sc_unit;
    uint32_t sc_reserved[5];
};

int32_t dt_find_utun_fd(void) {
    struct dt_ctl_info ctlInfo = {0};
    strncpy(ctlInfo.ctl_name, "com.apple.net.utun_control", sizeof(ctlInfo.ctl_name) - 1);

    for (int32_t fd = 0; fd <= 1024; fd++) {
        struct dt_sockaddr_ctl addr = {0};
        socklen_t length = (socklen_t)sizeof(addr);

        if (getpeername(fd, (struct sockaddr *)&addr, &length) != 0) {
            continue;
        }

        if (addr.sc_family != AF_SYSTEM || addr.ss_sysaddr != AF_SYS_CONTROL) {
            continue;
        }

        if (ctlInfo.ctl_id == 0 && ioctl(fd, CTLIOCGINFO, &ctlInfo) != 0) {
            continue;
        }

        if (addr.sc_id == ctlInfo.ctl_id) {
            return fd;
        }
    }

    return -1;
}
''')
          print('Applied robust iOS utun descriptor lookup')
          PY

      - name: Namespace AmneziaWG bridge symbols
        working-directory: Vendor/amneziawg-apple/Sources/WireGuardKitGo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          symbols = (
              "wgSetLogger",
              "wgTurnOn",
              "wgTurnOff",
              "wgSetConfig",
              "wgGetConfig",
              "wgBumpSockets",
              "wgDisableSomeRoamingForBrokenMobileSemantics",
              "wgVersion",
          )
          renamed = {name: "awg" + name[2:] for name in symbols}

          changed = 0
          for path in Path('.').rglob('*.go'):
              text = path.read_text()
              new = text
              for old, new_name in renamed.items():
                  new = new.replace(old, new_name)
              if new != text:
                  path.write_text(new)
                  changed += 1

          print(f'Namespaced AmneziaWG bridge symbols in {changed} Go file(s)')
          if changed == 0:
              raise SystemExit('No AmneziaWG bridge symbols found')
          PY

      - name: Verify bridge symbols are namespaced
        run: |
          set -euo pipefail
          grep -q 'awgTurnOn' PacketTunnel/AmneziaWGBridge.h
          grep -q 'awgGetConfig' PacketTunnel/AmneziaWGBridge.h
          ! grep -R -nE '(^|[^A-Za-z])wg(TurnOn|TurnOff|SetConfig|GetConfig|SetLogger|BumpSockets|DisableSomeRoamingForBrokenMobileSemantics|Version)\b' Vendor/amneziawg-apple/Sources/WireGuardKitGo --include='*.go'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            Vendor/vk-turn-proxy-ios/WireGuardBridge/go.sum
            Vendor/amneziawg-apple/Sources/WireGuardKitGo/go.mod

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodebuild -version
          go version

      - name: Build WireGuard TURN bridge
        working-directory: Vendor/vk-turn-proxy-ios/WireGuardBridge
        run: |
          set -euo pipefail
          chmod -R u+rwX .
          make clean
          make xcframework
          test -d build/WireGuardTURN.xcframework
          test -f build/WireGuardTURN.xcframework/ios-arm64/libwg-turn-ios-arm64.a

      - name: Build AmneziaWG Apple bridge
        working-directory: Vendor/amneziawg-apple/Sources/WireGuardKitGo
        run: |
          set -euo pipefail
          BUILD_TMP="$PWD/.build-tmp"
          rm -rf "$BUILD_TMP" out
          mkdir -p "$BUILD_TMP" out
          chmod -R u+rwX "$BUILD_TMP" out .

          REAL_RSYNC="$(command -v rsync)"
          mkdir -p "$BUILD_TMP/bin"
          cat > "$BUILD_TMP/bin/rsync" <<EOF
          #!/bin/sh
          exec "$REAL_RSYNC" --chmod=u+rwX "\$@"
          EOF
          chmod 755 "$BUILD_TMP/bin/rsync"
          export PATH="$BUILD_TMP/bin:$PATH"

          make clean
          PLATFORM_NAME=iphoneos \
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
          ARCHS=arm64 \
          CONFIGURATION_TEMP_DIR="$BUILD_TMP" \
          CONFIGURATION_BUILD_DIR="$PWD/out" \
          make build

          test -s out/libwg-go.a
          echo 'Checking AmneziaWG bridge exports:'
          nm -gU out/libwg-go.a | grep -E ' _?awg(SetLogger|TurnOn|TurnOff|SetConfig|GetConfig|BumpSockets|DisableSomeRoamingForBrokenMobileSemantics|Version)$'
          if nm -gU out/libwg-go.a | grep -E ' _?wg(SetLogger|TurnOn|TurnOff|SetConfig|GetConfig|BumpSockets|DisableSomeRoamingForBrokenMobileSemantics|Version)$'; then
            echo 'ERROR: un-namespaced AmneziaWG bridge symbols remain'
            exit 1
          fi

      - name: Generate unsigned Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project-unsigned.yml
          test -f DarkTunnel.xcodeproj/project.pbxproj
          test -f Vendor/amneziawg-apple/Sources/WireGuardKitGo/out/libwg-go.a

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/DerivedData"
          xcodebuild build \
            -project DarkTunnel.xcodeproj \
            -scheme DarkTunnel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM=''

      - name: Package unsigned IPA for ESign
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/DarkTunnel.app"
          test -d "$APP_PATH"
          test -d "$APP_PATH/PlugIns/PacketTunnel.appex"
          test -d "$APP_PATH/PlugIns/DarkTunnelLiveActivity.appex"

          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/"
          find "$RUNNER_TEMP/package/Payload" -name _CodeSignature -type d -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/package/Payload" -name embedded.mobileprovision -type f -delete

          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/DarkTunnel-unsigned-for-ESign.ipa" Payload
          test -s "$RUNNER_TEMP/DarkTunnel-unsigned-for-ESign.ipa"

      - name: Inspect IPA
        run: |
          set -euo pipefail
          unzip -l "$RUNNER_TEMP/DarkTunnel-unsigned-for-ESign.ipa" | grep -E 'DarkTunnel.app/(Info.plist|PlugIns/PacketTunnel.appex/|PlugIns/DarkTunnelLiveActivity.appex/)' | head -160

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DarkTunnel-unsigned-for-ESign
          path: ${{ runner.temp }}/DarkTunnel-unsigned-for-ESign.ipa
          if-no-files-found: error
          retention-days: 14
