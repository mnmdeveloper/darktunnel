name: Build unsigned IPA for ESign

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unsigned-ipa-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Checkout VK TURN engine
        uses: actions/checkout@v4
        with:
          repository: anton48/vk-turn-proxy-ios
          ref: main
          path: Vendor/vk-turn-proxy-ios

      - name: Checkout AmneziaWG Apple engine
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amneziawg-apple
          ref: master
          path: Vendor/amneziawg-apple

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: |
            Vendor/vk-turn-proxy-ios/WireGuardBridge/go.sum
            Vendor/amneziawg-apple/Sources/WireGuardKitGo/go.mod

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          go version

      - name: Build WireGuard TURN bridge
        working-directory: Vendor/vk-turn-proxy-ios/WireGuardBridge
        run: |
          set -euo pipefail
          chmod -R u+rwX .
          make clean
          make xcframework
          test -d build/WireGuardTURN.xcframework
          find build/WireGuardTURN.xcframework -maxdepth 3 -type f -print

      - name: Build AmneziaWG Apple bridge
        working-directory: Vendor/amneziawg-apple/Sources/WireGuardKitGo
        run: |
          set -euo pipefail

          # Do not let GNU patch create temporary backup files on the macOS
          # runner. The upstream Makefile patches a copied Go runtime, but the
          # runner can reject patch's temporary-file operation. We apply the
          # tiny upstream runtime patch ourselves and pre-create .prepared;
          # make then skips the patch recipe entirely.
          PATCH_TMP="$PWD/.patch-tmp"
          BUILD_TMP="$PWD/.build-tmp"
          GOROOT_COPY="$BUILD_TMP/wireguard-go-bridge/goroot"
          rm -rf "$PATCH_TMP" "$BUILD_TMP" out
          mkdir -p "$PATCH_TMP" "$BUILD_TMP" out
          chmod 700 "$PATCH_TMP" "$BUILD_TMP" out

          chmod -R u+rwX .
          make clean

          REAL_GOROOT="$(go env GOROOT)"
          mkdir -p "$GOROOT_COPY"
          rsync -a --delete --exclude=pkg/obj/go-build "$REAL_GOROOT/" "$GOROOT_COPY/"

          python3 - "$GOROOT_COPY" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          replacements = {
              "src/runtime/sys_darwin.go": [
                  ("libc_mach_absolute_time", "libc_mach_continuous_time"),
              ],
              "src/runtime/sys_darwin_amd64.s": [
                  ("CALL libc_mach_absolute_time(SB)", "CALL libc_mach_continuous_time(SB)"),
              ],
              "src/runtime/sys_darwin_arm64.s": [
                  ("BL libc_mach_absolute_time(SB)", "BL libc_mach_continuous_time(SB)"),
              ],
          }

          for rel, pairs in replacements.items():
              path = root / rel
              text = path.read_text()
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new)
              path.write_text(text)
              print(f"patched {path}")

          prepared = root / ".prepared"
          prepared.touch()
          print(f"prepared {prepared}")
          PY

          PLATFORM_NAME=iphoneos \
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
          ARCHS=arm64 \
          CONFIGURATION_TEMP_DIR="$BUILD_TMP" \
          CONFIGURATION_BUILD_DIR="$PWD/out" \
          make build

          test -f out/libwg-go.a

      - name: Generate full unsigned project
        run: xcodegen generate --spec project-unsigned.yml

      - name: Build app, PacketTunnel and Live Activity without signing
        run: |
          set +e
          xcodebuild build \
            -project DarkTunnel.xcodeproj \
            -scheme DarkTunnel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo
            echo '================ ACTUAL XCODE ERRORS ================'
            grep -nE '(^|: )(error:|fatal error:)|BUILD FAILED|The following build commands failed' "$RUNNER_TEMP/xcodebuild.log" | tail -200 || true
            echo '====================================================='
            exit "$STATUS"
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/DarkTunnel.app"
          test -d "$APP_PATH"
          test -d "$APP_PATH/PlugIns/PacketTunnel.appex"
          test -d "$APP_PATH/PlugIns/DarkTunnelLiveActivity.appex"

          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/package/Payload/"
          find "$RUNNER_TEMP/package/Payload" -name _CodeSignature -type d -prune -exec rm -rf {} + || true
          find "$RUNNER_TEMP/package/Payload" -name embedded.mobileprovision -type f -delete || true

          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$RUNNER_TEMP/DarkTunnel-unsigned-for-ESign.ipa" Payload

      - name: Inspect package
        run: |
          unzip -l "$RUNNER_TEMP/DarkTunnel-unsigned-for-ESign.ipa" | grep -E 'DarkTunnel.app/|PacketTunnel.appex/|DarkTunnelLiveActivity.appex/' | head -160

      - uses: actions/upload-artifact@v4
        with:
          name: DarkTunnel-unsigned-for-ESign
          path: ${{ runner.temp }}/DarkTunnel-unsigned-for-ESign.ipa
          retention-days: 14
