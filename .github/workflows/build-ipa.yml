name: Build experimental signed IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen openssl@3

      - name: Decode signing files
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"

          clean_b64() {
            printf '%s' "$1" | tr -d '\r\n\t '
          }

          clean_b64 "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.original.p12"
          clean_b64 "$MOBILEPROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          if ! "$OPENSSL" pkcs12 -in "$RUNNER_TEMP/certificate.original.p12" -passin env:P12_PASSWORD -info -noout >/dev/null 2>&1; then
            if LC_ALL=C grep -Eq '^[A-Za-z0-9+/=[:space:]]+$' "$RUNNER_TEMP/certificate.original.p12"; then
              tr -d '\r\n\t ' < "$RUNNER_TEMP/certificate.original.p12" | base64 --decode > "$RUNNER_TEMP/certificate.fixed.p12"
              mv "$RUNNER_TEMP/certificate.fixed.p12" "$RUNNER_TEMP/certificate.original.p12"
            fi
          fi

          "$OPENSSL" pkcs12 \
            -in "$RUNNER_TEMP/certificate.original.p12" \
            -passin env:P12_PASSWORD \
            -nodes \
            -out "$RUNNER_TEMP/certificate.pem"

          "$OPENSSL" pkcs12 \
            -export \
            -legacy \
            -in "$RUNNER_TEMP/certificate.pem" \
            -out "$RUNNER_TEMP/certificate.p12" \
            -passout env:P12_PASSWORD

          "$OPENSSL" pkcs12 -in "$RUNNER_TEMP/certificate.p12" -passin env:P12_PASSWORD -info -noout >/dev/null
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" >/dev/null
          rm -f "$RUNNER_TEMP/certificate.pem" "$RUNNER_TEMP/certificate.original.p12"

      - name: Install certificate
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security list-keychain -d user -s build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install one provisioning profile
        run: |
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Generate project
        run: xcodegen generate

      - name: Archive with the same profile for both targets
        run: |
          xcodebuild archive \
            -project DarkTunnel.xcodeproj \
            -scheme DarkTunnel \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/DarkTunnel.xcarchive" \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGNING_ALLOWED=YES \
            clean archive

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.lavender3512.currant6944</key><string>$PROFILE_NAME</string>
              <key>app.lavender3512.currant6944.PacketTunnel</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DarkTunnel.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: DarkTunnel-experimental-IPA
          path: ${{ runner.temp }}/export/*.ipa
