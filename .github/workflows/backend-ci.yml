name: Backend CI

on:
  push:
    branches: [main, backend-bot-mvp, server-onboarding-v2]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'docker-compose.backend.yml'
      - 'install-backend.sh'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'docker-compose.backend.yml'
      - 'install-backend.sh'
      - '.github/workflows/backend-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend/app
      - name: Validate shell scripts
        run: bash -n deploy/update-all.sh deploy/node-installer/install.sh
      - name: Prepare CI environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-password
          EOF
          cat > backend/.env <<'EOF'
          ENVIRONMENT=test
          PUBLIC_API_URL=https://api.example.test
          POSTGRES_PASSWORD=ci-password
          DATABASE_URL=postgresql+asyncpg://darktunnel:ci-password@db:5432/darktunnel
          REDIS_URL=redis://redis:6379/0
          TELEGRAM_BOT_TOKEN=123456:CI_TOKEN
          TELEGRAM_OWNER_ID=1
          ACTIVATION_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          SERVER_CONFIG_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          WDTT_PUBLIC_HOST=127.0.0.1
          WDTT_PUBLIC_PORT=56000
          EOF
      - name: Validate Docker Compose
        run: docker compose --env-file .env -f docker-compose.backend.yml config >/dev/null
      - name: Build containers
        run: docker compose --env-file .env -f docker-compose.backend.yml build api bot
