name: Build unsigned IPA for ESign

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DarkTunnel/**'
      - 'PacketTunnel/**'
      - 'LiveActivity/**'
      - 'Shared/**'
      - 'Vendor/**'
      - 'DarkTunnel.xcodeproj/**'
      - '.github/workflows/ios-unsigned-ipa.yml'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  SCHEME: DarkTunnel
  PROJECT: DarkTunnel.xcodeproj

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA for ESign
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version

      - name: Show project targets
        run: |
          set -euo pipefail
          xcodebuild -project "$PROJECT" -list

      - name: Build unsigned app
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build

          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM=''

      - name: Locate DarkTunnel.app
        id: locate_app
        run: |
          set -euo pipefail
          APP="$(find "$PWD/build/DerivedData/Build/Products" -type d -path '*/Release-iphoneos/DarkTunnel.app' -print -quit)"
          test -n "$APP"
          test -f "$APP/Info.plist"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "Unsigned app: $APP"

      - name: Verify unsigned app bundle
        env:
          APP: ${{ steps.locate_app.outputs.app }}
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true
          test ! -e "$APP/_CodeSignature"
          find "$APP" -maxdepth 2 -type d -name '*.appex' -print

      - name: Package IPA for ESign
        env:
          APP: ${{ steps.locate_app.outputs.app }}
        run: |
          set -euo pipefail
          rm -rf build/Payload build/DarkTunnel-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/DarkTunnel.app
          cd build
          /usr/bin/zip -qry -X DarkTunnel-unsigned.ipa Payload
          test -s DarkTunnel-unsigned.ipa
          unzip -l DarkTunnel-unsigned.ipa | head -40

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DarkTunnel-unsigned-IPA
          path: build/DarkTunnel-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
