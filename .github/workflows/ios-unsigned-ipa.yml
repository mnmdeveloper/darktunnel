name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DarkTunnel/**'
      - 'PacketTunnel/**'
      - 'LiveActivity/**'
      - 'Shared/**'
      - 'Vendor/**'
      - 'DarkTunnel.xcodeproj/**'
      - '.github/workflows/ios-unsigned-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild clean archive \
            -project DarkTunnel.xcodeproj \
            -scheme DarkTunnel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/DarkTunnel.xcarchive" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM=''

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$PWD/build/DarkTunnel.xcarchive/Products/Applications/DarkTunnel.app"
          test -d "$APP"
          rm -rf build/Payload build/DarkTunnel-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/DarkTunnel.app
          cd build
          /usr/bin/zip -qry DarkTunnel-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DarkTunnel-unsigned-IPA
          path: build/DarkTunnel-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
