name: Build unsigned IPA for ESign

run-name: "Build unsigned IPA for ESign #${{ github.run_number }}"

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'DarkTunnel/**'
      - 'PacketTunnel/**'
      - 'LiveActivity/**'
      - 'Shared/**'
      - 'Vendor/**'
      - 'project-unsigned.yml'
      - '.github/workflows/ios-unsigned-ipa.yml'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA for ESign
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout DarkTunnel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Checkout VK TURN engine
        uses: actions/checkout@v4
        with:
          repository: anton48/vk-turn-proxy-ios
          ref: main
          path: Vendor/vk-turn-proxy-ios
          fetch-depth: 1

      - name: Checkout AmneziaWG Apple engine
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn/amneziawg-apple
          ref: master
          path: Vendor/amneziawg-apple
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: Vendor/amneziawg-apple/Sources/WireGuardKitGo/go.mod

      - name: Verify Xcode and SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          go version

      - name: Namespace AmneziaWG bridge symbols
        working-directory: Vendor/amneziawg-apple/Sources/WireGuardKitGo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          names = (
              "wgSetLogger",
              "wgTurnOn",
              "wgTurnOff",
              "wgSetConfig",
              "wgGetConfig",
              "wgBumpSockets",
              "wgDisableSomeRoamingForBrokenMobileSemantics",
              "wgVersion",
          )
          changed = 0
          for path in Path('.').rglob('*.go'):
              old = path.read_text()
              new = old
              for name in names:
                  new = new.replace(name, 'awg' + name[2:])
              if new != old:
                  path.write_text(new)
                  changed += 1
          if changed == 0:
              raise SystemExit('No AmneziaWG bridge symbols found')
          print(f'Namespaced AmneziaWG symbols in {changed} Go files')
          PY

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Build WireGuard TURN bridge
        working-directory: Vendor/vk-turn-proxy-ios/WireGuardBridge
        run: |
          set -euo pipefail
          chmod -R u+rwX .
          make clean
          make xcframework
          test -f build/WireGuardTURN.xcframework/ios-arm64/libwg-turn-ios-arm64.a

      - name: Build patched AmneziaWG archive
        working-directory: Vendor/amneziawg-apple/Sources/WireGuardKitGo
        run: |
          set -euo pipefail
          BUILD_TMP="$PWD/.build-tmp"
          rm -rf "$BUILD_TMP" out
          mkdir -p "$BUILD_TMP" out
          chmod -R u+rwX "$BUILD_TMP" out .
          REAL_RSYNC="$(command -v rsync)"
          mkdir -p "$BUILD_TMP/bin"
          printf '#!/bin/sh\nexec "%s" --chmod=u+rwX "$@"\n' "$REAL_RSYNC" > "$BUILD_TMP/bin/rsync"
          chmod 755 "$BUILD_TMP/bin/rsync"
          export PATH="$BUILD_TMP/bin:$PATH"
          make clean
          PLATFORM_NAME=iphoneos \
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
          ARCHS=arm64 \
          CONFIGURATION_TEMP_DIR="$BUILD_TMP" \
          CONFIGURATION_BUILD_DIR="$PWD/out" \
          make build
          test -s out/libwg-go.a
          nm -gU out/libwg-go.a | grep -E ' _?awg(SetLogger|TurnOn|TurnOff|SetConfig|GetConfig|BumpSockets|DisableSomeRoamingForBrokenMobileSemantics|Version)$'
          if nm -gU out/libwg-go.a | grep -E ' _?wg(SetLogger|TurnOn|TurnOff|SetConfig|GetConfig|BumpSockets|DisableSomeRoamingForBrokenMobileSemantics|Version)$'; then
            echo 'ERROR: un-namespaced AmneziaWG bridge symbols remain'
            exit 1
          fi

      - name: Build isolated AmneziaWG dynamic framework
        working-directory: Vendor/amneziawg-apple/Sources/WireGuardKitGo
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          ARCHIVE="$PWD/out/libwg-go.a"
          FRAMEWORK="$PWD/out/AmneziaWG.framework"
          rm -rf "$FRAMEWORK"
          mkdir -p "$FRAMEWORK/Headers"

          # iOS Go supports c-archive, not c-shared. A plain archive is not
          # pulled into a dylib unless it satisfies an undefined symbol, so
          # force-load the complete Go archive into the framework binary.
          clang -dynamiclib \
            -arch arm64 \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min=17.0 \
            -Wl,-no_adhoc_codesign \
            -Wl,-force_load,"$ARCHIVE" \
            -Wl,-install_name,@rpath/AmneziaWG.framework/AmneziaWG \
            -Wl,-headerpad_max_install_names \
            -framework Foundation \
            -framework Security \
            -framework NetworkExtension \
            -lresolv \
            -o "$FRAMEWORK/AmneziaWG"

          test -s "$FRAMEWORK/AmneziaWG"
          cp "$GITHUB_WORKSPACE/PacketTunnel/AmneziaWGBridge.h" "$FRAMEWORK/Headers/AmneziaWG.h"
          cp "$GITHUB_WORKSPACE/PacketTunnel/AmneziaWGBridge.h" "$FRAMEWORK/AmneziaWG.h"
          cat > "$FRAMEWORK/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>app.lavender3512.currant6944.AmneziaWG</string>
          <key>CFBundleName</key><string>AmneziaWG</string>
          <key>CFBundleExecutable</key><string>AmneziaWG</string>
          <key>CFBundlePackageType</key><string>FMWK</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          </dict></plist>
          PLIST
          otool -L "$FRAMEWORK/AmneziaWG"
          nm -gU "$FRAMEWORK/AmneziaWG" | grep -E ' _?awg(SetLogger|TurnOn|TurnOff|SetConfig|GetConfig|BumpSockets|DisableSomeRoamingForBrokenMobileSemantics|Version)$'

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          test -f project-unsigned.yml
          rm -rf DarkTunnel.xcodeproj
          xcodegen generate --spec project-unsigned.yml
          test -f DarkTunnel.xcodeproj/project.pbxproj
          xcodebuild -project DarkTunnel.xcodeproj -list

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/DerivedData"
          xcodebuild build \
            -project DarkTunnel.xcodeproj \
            -scheme DarkTunnel \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM=''

      - name: Verify app and PacketTunnel linkage
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/DarkTunnel.app"
          EXT="$APP/PlugIns/PacketTunnel.appex"
          test -d "$APP"
          test -d "$EXT"
          test -d "$EXT/Frameworks/AmneziaWG.framework"
          test -d "$APP/PlugIns/DarkTunnelLiveActivity.appex"
          test ! -e "$APP/_CodeSignature"
          test ! -e "$EXT/_CodeSignature"
          test ! -e "$EXT/Frameworks/AmneziaWG.framework/_CodeSignature"
          otool -L "$EXT/PacketTunnel" | grep -F '@rpath/AmneziaWG.framework/AmneziaWG'
          ! otool -L "$EXT/PacketTunnel" | grep -F 'libwg-go'

      - name: Package unsigned IPA for ESign
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/DarkTunnel.app"
          IPA="$RUNNER_TEMP/DarkTunnel-unsigned.ipa"
          rm -rf "$RUNNER_TEMP/package"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP" "$RUNNER_TEMP/package/DarkTunnel.app"
          find "$RUNNER_TEMP/package" -name _CodeSignature -type d -prune -exec rm -rf {} +
          find "$RUNNER_TEMP/package" -name embedded.mobileprovision -type f -delete
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry -X "$IPA" Payload
          unzip -tq "$IPA"
          test -s "$IPA"
          unzip -l "$IPA" | grep -E 'DarkTunnel.app/(PlugIns/PacketTunnel.appex/|PlugIns/DarkTunnelLiveActivity.appex/)' | head -200

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DarkTunnel-unsigned-IPA
          path: ${{ runner.temp }}/DarkTunnel-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DarkTunnel-build-logs
          path: |
            ${{ runner.temp }}/DerivedData/Logs/**/*.xcactivitylog
            ${{ runner.temp }}/DerivedData/Build/**/*.log
          if-no-files-found: ignore
          retention-days: 7
