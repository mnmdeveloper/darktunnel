name: DarkTunnel
options:
  bundleIdPrefix: app.lavender3512
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 6
    MARKETING_VERSION: 0.3.2
targets:
  DarkTunnel:
    type: application
    platform: iOS
    sources:
      - path: DarkTunnel
      - path: Shared
    info:
      path: DarkTunnel/Info.plist
    entitlements:
      path: DarkTunnel/DarkTunnel.entitlements
    dependencies:
      - target: PacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lavender3512.currant6944
        PRODUCT_NAME: DarkTunnel
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
    info:
      path: PacketTunnel/Info.plist
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lavender3512.currant6944.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
