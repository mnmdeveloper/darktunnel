services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: darktunnel
      POSTGRES_USER: darktunnel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - darktunnel_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - db
      - redis
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /etc/wdtt:/host/etc/wdtt:ro

  bot:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.bot"]
    env_file: ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - /etc/wdtt:/host/etc/wdtt:ro

volumes:
  darktunnel_postgres:
