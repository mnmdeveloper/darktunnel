services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: darktunnel
      POSTGRES_USER: darktunnel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - darktunnel_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  vkturn:
    build: ./vkturn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    ports:
      - "56100:56100/tcp"
      - "56100:56100/udp"
    volumes:
      - darktunnel_vkturn:/data

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - db
      - redis
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /etc/wdtt:/host/etc/wdtt:ro

  bot:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.bot_entry"]
    env_file: ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - /etc/wdtt:/host/etc/wdtt:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - darktunnel_caddy_data:/data
      - darktunnel_caddy_config:/config

volumes:
  darktunnel_postgres:
  darktunnel_caddy_data:
  darktunnel_caddy_config:
  darktunnel_vkturn:
