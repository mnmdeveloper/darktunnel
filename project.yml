name: DarkTunnel
options:
  bundleIdPrefix: app.lavender3512
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 13
    MARKETING_VERSION: 0.7.0
targets:
  DarkTunnel:
    type: application
    platform: iOS
    sources:
      - path: DarkTunnel
      - path: Shared
    info:
      path: DarkTunnel/Info.plist
    entitlements:
      path: DarkTunnel/DarkTunnel.entitlements
    dependencies:
      - target: PacketTunnel
        embed: true
      - target: DarkTunnelLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lavender3512.currant6944
        PRODUCT_NAME: DarkTunnel
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    scheme:
      testTargets: []

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
    info:
      path: PacketTunnel/Info.plist
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
    dependencies:
      - framework: Vendor/vk-turn-proxy-ios/WireGuardBridge/build/WireGuardTURN.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lavender3512.currant6944.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/BridgeHeader.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/vk-turn-proxy-ios/WireGuardBridge/include"
          - "$(PROJECT_DIR)/PacketTunnel"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/vk-turn-proxy-ios/WireGuardBridge/build"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor/amneziawg-apple/Sources/WireGuardKitGo/out"
        OTHER_LDFLAGS:
          - "-lresolv"
          - "-lwg-go"

  DarkTunnelLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared
    info:
      path: LiveActivity/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lavender3512.currant6944.LiveActivity
        PRODUCT_NAME: DarkTunnelLiveActivity
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
